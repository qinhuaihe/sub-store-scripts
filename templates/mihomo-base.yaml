# Mihomo 基础模板
# 设计目标：
# 1. 作为 Sub-Store 的“mihomo 配置”模板使用
# 2. 节点由 Sub-Store 后续注入/合并，因此这里不写具体代理节点
# 3. 与 rename-proxies.js 的命名格式配合：
#    [订阅名] 🇭🇰 香港 HK [协议] 01
# 4. 信息节点（流量/到期）保留展示，但不会进入可选代理组

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# 代理节点由 Sub-Store 注入
proxies: []

# =========================
# DNS
# =========================
dns:
  ipv6: false
  enable: true
  listen: '0.0.0.0:1053'
  use-hosts: true

  # 用于解析 DoH 上游域名；必须使用纯 IP DNS。
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - 119.29.29.29
    - 119.28.28.28
    - 180.76.76.76
    - 8.8.8.8

  # 默认 DNS 上游
  nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://koala.madns-lemon.site:2443/dns-query'
    - 'https://whale.madns-peach.site:2443/dns-query'
    - 'https://otter.madns-pear.site:2443/dns-query'
    - 'https://rhino.madns-berry.site:2443/dns-query'
    - 'https://cobra.madns-cherry.site:2443/dns-query'
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 以下域名绕过 Fake-IP，兼容局域网、NTP、STUN、游戏平台、音乐/视频等场景。
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'time1.*.com'
    - 'time2.*.com'
    - 'time3.*.com'
    - 'time4.*.com'
    - 'time5.*.com'
    - 'time6.*.com'
    - 'time7.*.com'
    - 'ntp.*.com'
    - 'ntp1.*.com'
    - 'ntp2.*.com'
    - 'ntp3.*.com'
    - 'ntp4.*.com'
    - 'ntp5.*.com'
    - 'ntp6.*.com'
    - 'ntp7.*.com'
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - '+.pool.ntp.org'
    - 'time1.cloud.tencent.com'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'swscan.apple.com'
    - 'mesu.apple.com'
    - 'music.163.com'
